
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaFlow AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">L</div>
        <div>
          <h1>LinguaFlow AI</h1>
          <p>Think in your language. Communicate globally.</p>
        </div>
      </div>
      <span class="status">BETA</span>
    </header>

    <section class="settings">
      <label for="mode">Writing mode</label>
      <select id="mode">
        <option value="professional">Professional</option>
        <option value="casual">Casual</option>
        <option value="grammar">Grammar correction</option>
      </select>
    </section>

    <section class="editor">
      <div class="section-heading">
        <label for="sourceText">Your message</label>
        <span id="charCount">0 characters</span>
      </div>

      <textarea
        id="sourceText"
        placeholder="Type in Marathi, Hinglish, or English..."
        maxlength="3000"
      ></textarea>
    </section>

    <button id="convertBtn" type="button">
      Convert message
    </button>

    <section class="result-section">
      <div class="section-heading">
        <h2>Result</h2>
        <span id="aiStatus" class="ai-badge">AI READY</span>
      </div>

      <div
        id="result"
        class="result"
        aria-live="polite"
        aria-atomic="true"
      >Your converted message will appear here.</div>

      <div class="result-actions">
        <button id="copyBtn" class="secondary-btn" type="button">
          Copy result
        </button>

        <button id="clearBtn" class="secondary-btn" type="button">
          Clear
        </button>
      </div>
    </section>

    <footer>
      <span>Made for better communication</span>
      <span>Your words, your control.</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
